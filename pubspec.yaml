name: jdihkotakendari
description: "Aplikasi Mobile JDIH Kota Kendari"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  flutter_cached_pdfview: ^0.4.3
  url_launcher: ^6.2.4
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  dio: ^5.3.0
  path_provider: ^2.1.1
  open_filex: ^4.4.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linter untuk menjaga kerapihan kode
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Perhatikan spasi di bawah ini:
  assets:
    - assets/images/logo.png
    - assets/images/logo_kendari.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21